name: Playwright DemoQA CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# 1. РАЗРЕШЕНИЯ: Даем GitHub право создавать страницы и записывать отчеты
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x 

      - name: Install dependencies
        run: dotnet restore PlaywrightDemoQA/PlaywrightDemoQA.csproj

      - name: Build project
        run: dotnet build PlaywrightDemoQA/PlaywrightDemoQA.csproj --configuration Release --no-restore

      - name: Install Playwright Browsers
        run: pwsh PlaywrightDemoQA/bin/Release/net10.0/playwright.ps1 install --with-deps

      - name: Run Tests
        # Добавлена генерация .trx файла для истории запусков
        run: dotnet test PlaywrightDemoQA/PlaywrightDemoQA.csproj --configuration Release --no-build --logger:"trx;LogFileName=results.trx"

      - name: Upload Playwright Traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: PlaywrightDemoQA/bin/Release/net10.0/playwright-traces/

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots
          path: PlaywrightDemoQA/bin/Release/net10.0/screenshots/

      # 2. АРТЕФАКТЫ: Сохраняем результаты тестов для следующей джобы
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: PlaywrightDemoQA/bin/Release/net10.0/allure-results/

  # 3. CD JOBS: Генерация и публикация красивого отчета Allure
  report:
    runs-on: ubuntu-latest
    needs: test       # Ждем завершения тестов
    if: always()      # Делаем отчет даже если тесты упали
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true # Если запускаем в первый раз и ветки еще нет

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Build Allure Report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: Deploy report to Github Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          publish_branch: gh-pages
